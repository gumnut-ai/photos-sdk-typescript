name: Release Please

# Generated by stlc (publish.release in the Stainless config) and then
# hand-adjusted: the RELEASE_PLEASE_TOKEN PAT is replaced by a short-lived
# gumnut-sdk-pipeline app token. It must be an app token rather than
# GITHUB_TOKEN — releases created with GITHUB_TOKEN do not trigger the
# publish workflow. stlc preserves .github/workflows/ across regeneration, so
# this edit survives builds (a `stlc build --rewrite-scaffold` would undo it).
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-please:
    if: github.repository == 'gumnut-ai/photos-sdk-typescript'
    runs-on: ubuntu-latest

    steps:
      - name: "Mint release token (Contents + PRs: write on this repo)"
        id: token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.GUMNUT_SDK_PIPELINE_APP_ID }}
          private-key: ${{ secrets.GUMNUT_SDK_PIPELINE_PRIVATE_KEY }}
          owner: gumnut-ai
          repositories: photos-sdk-typescript
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          token: ${{ steps.token.outputs.token }}
