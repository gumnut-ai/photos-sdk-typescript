# This workflow is triggered when a GitHub release is created.
# It can also be run manually to re-publish to NPM in case it failed for some reason.
# You can run this workflow by navigating to https://www.github.com/gumnut-ai/photos-sdk-typescript/actions/workflows/publish-npm.yml
name: Publish NPM
on:
  workflow_dispatch:

  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: publish
    if: github.repository == 'gumnut-ai/photos-sdk-typescript'
    runs-on: ubuntu-latest
    # Publishing waits until a reviewer approves the deployment. The protected
    # `release` environment is configured in this repository's settings.
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node
        # v3 caches only when `cache:` is set, and it is not set here.
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1 # zizmor: ignore[cache-poisoning]
        with:
          node-version: '24'

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
          no-cache: true

      - name: Install dependencies
        run: |
          ./scripts/bootstrap

      - name: Publish to NPM
        run: |
          bash ./bin/publish-npm
