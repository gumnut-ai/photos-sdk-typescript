name: Promote SDK

# Promote staging to production by fast-forwarding production main up to staging,
# preserving SHAs so the trunks stay identical and linear (nothing to heal on the
# next stlc build). Manual dispatch by design: a maintainer promotes the accumulated
# batch to cut a release; release-please then opens its version PR on production.
#
# This file lives in both the staging and production repo (stlc preserves
# .github/workflows/ across regeneration); the job self-routes so it only runs
# on staging. Adapted from the stlc sdk-repo example; the PAT is replaced by a
# short-lived gumnut-sdk-pipeline app token minted per run.
#
# If the promote refuses with "production/main is not an ancestor": production
# advanced on its own (a release, or another merged PR) and has not been back-synced.
# Run the "Sync SDK repos" workflow here (or wait for its next scheduled poll), then
# re-run the promote. Never force-push either trunk.
#
# If the promote refuses with "Staging CI not green": the CI workflow's run for
# the staging main commit being promoted is missing, still running, or failed.
# Wait for a running CI to finish, or fix the failure (re-run a flaky job),
# then re-run the promote.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository == 'gumnut-ai/photos-typescript-staging'
    # actions: read is for the CI check before the push; issues: write is
    # for the failure-issue step at the end.
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      PRODUCTION_REPO: gumnut-ai/photos-sdk-typescript
    steps:
      - name: 'Mint promote token (Contents + Workflows: write on production)'
        # Workflows: write because a promote carries .github/workflows/** to
        # production (release-please, publish, and these two files).
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.GUMNUT_SDK_PIPELINE_APP_ID }}
          private-key: ${{ secrets.GUMNUT_SDK_PIPELINE_PRIVATE_KEY }}
          owner: gumnut-ai
          repositories: photos-sdk-typescript
          permission-contents: write
          permission-workflows: write

      - name: Check out staging
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch production main
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          git remote add production \
            "https://x-access-token:${GH_TOKEN}@github.com/${PRODUCTION_REPO}.git"
          git fetch production main

      - name: Check whether production already has staging's content
        id: diff
        run: |
          # Staging strictly ahead: fast-forward, even when its new commits change
          # no files (an empty conventional commit that starts a release).
          if git merge-base --is-ancestor production/main origin/main &&
            [ "$(git rev-parse production/main)" != "$(git rev-parse origin/main)" ]; then
            echo "synced=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # After a release, production has release-please commits staging lacks, so compare trees.
          MERGED=$(git merge-tree --write-tree production/main origin/main) || MERGED=conflict
          PRODUCTION_TREE=$(git rev-parse 'production/main^{tree}')
          if [ "$MERGED" = "$PRODUCTION_TREE" ]; then
            echo "Production already contains staging's content. Nothing to promote."
            echo "synced=true" >> "$GITHUB_OUTPUT"
          else
            echo "synced=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require green CI on the commit being promoted
        # Production receives exactly this commit, so the CI workflow's newest
        # run for it on main must have completed successfully. A just-pushed
        # commit is refused until its CI finishes.
        if: steps.diff.outputs.synced == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          sha=$(git rev-parse origin/main)
          run=$(gh api "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${sha}&branch=main&event=push&per_page=100" \
            --jq '.workflow_runs | max_by(.run_number) // empty | [.status, (.conclusion // "none"), .html_url] | @tsv')
          if [ -z "$run" ]; then
            echo "::error title=Staging CI not green::no CI run found for staging main ${sha}. Find out why CI did not run on that push before promoting it."
            exit 1
          fi
          IFS=$'\t' read -r status conclusion url <<< "$run"
          if [ "$status" != completed ]; then
            echo "::error title=Staging CI not green::CI for staging main ${sha} is ${status}: ${url}. Wait for it to finish, then re-run this workflow."
            exit 1
          fi
          if [ "$conclusion" != success ]; then
            echo "::error title=Staging CI not green::CI for staging main ${sha} concluded ${conclusion}: ${url}. Fix it (or re-run a flaky job), then re-run this workflow."
            exit 1
          fi
          echo "CI passed for staging main ${sha}: ${url}"

      - name: Promote staging to production (fast-forward)
        if: steps.diff.outputs.synced == 'false'
        run: |
          # Refuse unless production is an ancestor of staging: otherwise the trunks
          # have forked (production advanced without a back-sync) and FF is unsafe.
          if ! git merge-base --is-ancestor production/main origin/main; then
            echo "::error title=Promote blocked::production/main is not an ancestor of staging main. Back-sync production into staging first (run the Sync SDK repos workflow), then re-run."
            exit 1
          fi
          git push production origin/main:refs/heads/main
          echo "Fast-forwarded production/main to staging/main."

      - name: Report failure
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          msg="stlc promote failed in ${REPO}. Until a promote succeeds, production main and its releases miss what staging has gained — investigate before the next release. Run: ${RUN_URL}"
          echo "::error title=stlc workflow failed::$msg"
          { echo "### ⚠️ stlc workflow failed"; echo ""; echo "$msg"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Open, update or close this workflow's failure issue
        # While this workflow fails, keep one open issue for it in this repo,
        # marked in its body; its next successful run closes that issue. The
        # label and title match the SDK pipeline's other failure issues.
        # always(): a job that hits timeout-minutes ends cancelled, and only
        # always() and cancelled() steps still run.
        # continue-on-error: a reporting hiccup must not turn a successful
        # promote red, and a failed run is already red.
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          MARKER: '<!-- sdk-pipeline-failure: stlc-promote.yml -->'
        run: |
          label=sdk-pipeline-failure
          # The REST list reads current state; `gh issue list --label` uses the
          # search index, which can lag a just-created issue.
          issues=$(gh api "repos/$REPO/issues?labels=$label&state=open&per_page=100" \
            --jq '.[] | select(.pull_request | not) | select((.body // "") | contains($ENV.MARKER)) | .number')
          if [ "$JOB_STATUS" = cancelled ]; then
            outcome="Promote was cancelled or timed out"
          else
            outcome="Promote failed"
          fi
          if [ "$JOB_STATUS" = success ]; then
            for issue in $issues; do
              gh issue close "$issue" --repo "$REPO" --reason completed --comment "Promote passed: ${RUN_URL}"
            done
          elif [ -n "$issues" ]; then
            gh issue comment "$(printf '%s\n' "$issues" | head -n 1)" --repo "$REPO" --body "${outcome}: ${RUN_URL}"
          else
            gh label create "$label" --repo "$REPO" --force --color B60205 \
              --description "An SDK pipeline run failed; closed by the next successful run"
            gh issue create --repo "$REPO" --title "SDK pipeline is failing" --label "$label" --body "${outcome}: ${RUN_URL}

          Later failures of this workflow comment here; its next successful run closes this issue.

          ${MARKER}"
          fi
