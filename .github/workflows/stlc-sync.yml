name: Sync SDK repos

# Keeps the staging and production trunks in sync: fast-forwards production main
# back onto staging after a release (or any other production-side commit) so the
# trunks converge after a release. Main generation also reconciles before building.
#
# This file lives in both the staging and production repo (stlc preserves
# .github/workflows/ across regeneration); the job self-routes so it only runs
# on staging. Adapted from the stlc sdk-repo example, with the PAT replaced by a
# short-lived gumnut-sdk-pipeline app token. The example's eager
# notify-back-sync and seal-dispatch jobs are deliberately omitted (no dispatch
# tokens in our setup — the six-hour poll is the background sync).
#
# If the back-sync refuses with "staging main is not an ancestor": the trunks
# forked — something landed on staging main while production was ahead. Resolve
# by hand in a clone: merge production/main into staging main (plain merge, no
# force), push, then let the poll confirm. Never force-push either trunk.
on:
  schedule:
    # Background convergence between the six-hour main generation runs.
    # Main generation also reconciles staging before building.
    # Manual dispatch remains available when immediate alignment is needed.
    - cron: '37 3,9,15,21 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  back-sync:
    # Fast-forward production main back onto staging so the trunks stay identical.
    runs-on: ubuntu-slim
    timeout-minutes: 10
    if: github.repository == 'gumnut-ai/photos-typescript-staging'
    # issues: write is for the failure-issue step at the end.
    permissions:
      contents: read
      issues: write
    # A newer run waits rather than cancelling this one: a cancelled run
    # reports like a timed-out one and would open the failure issue.
    concurrency:
      group: stlc-back-sync
      cancel-in-progress: false
    env:
      PRODUCTION_REPO: gumnut-ai/photos-sdk-typescript
    steps:
      - name: 'Mint sync token (Contents: write on staging + production; production is only read)'
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.GUMNUT_SDK_PIPELINE_APP_ID }}
          private-key: ${{ secrets.GUMNUT_SDK_PIPELINE_PRIVATE_KEY }}
          owner: gumnut-ai
          repositories: photos-typescript-staging,photos-sdk-typescript
          permission-contents: write

      - name: Check out staging
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch production main
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          git remote add production "https://x-access-token:${GH_TOKEN}@github.com/${PRODUCTION_REPO}.git"
          git fetch production main

      - name: Check whether production has content staging lacks
        id: diff
        run: |
          # Content compare: would merging production into staging change its tree?
          # If not, staging already has production's content (release-please commits).
          MERGED=$(git merge-tree --write-tree origin/main production/main) || MERGED=conflict
          STAGING_TREE=$(git rev-parse 'origin/main^{tree}')
          if [ "$MERGED" = "$STAGING_TREE" ]; then
            echo "Staging already has production's content. Nothing to pull back."
            echo "behind=false" >> "$GITHUB_OUTPUT"
          else
            echo "behind=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync production to staging (fast-forward)
        if: steps.diff.outputs.behind == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          # Refuse unless staging is an ancestor of production: otherwise the
          # trunks have forked and a fast-forward would be unsafe.
          if ! git merge-base --is-ancestor origin/main production/main; then
            echo "::error title=Back-sync blocked::staging main is not an ancestor of production/main. The trunks forked; merge production/main into staging main by hand (no force), then re-run."
            exit 1
          fi
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" production/main:refs/heads/main
          echo "Fast-forwarded staging/main to production/main."

      - name: Report failure
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          msg="stlc back-sync (sync from production) failed in ${REPO}. A stalled back-sync lets custom-code tracking drift, which later builds refuse on — investigate before the next build. Run: ${RUN_URL}"
          echo "::error title=stlc workflow failed::$msg"
          { echo "### ⚠️ stlc workflow failed"; echo ""; echo "$msg"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Open, update or close this workflow's failure issue
        # While this workflow fails, keep one open issue for it in this repo,
        # marked in its body; its next successful run closes that issue. The
        # label and title match the SDK pipeline's other failure issues.
        # always(): a job that hits timeout-minutes ends cancelled, and only
        # always() and cancelled() steps still run.
        # continue-on-error: a reporting hiccup must not turn a successful
        # back-sync red, and a failed run is already red.
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          MARKER: '<!-- sdk-pipeline-failure: stlc-sync.yml -->'
        run: |
          label=sdk-pipeline-failure
          # The REST list reads current state; `gh issue list --label` uses the
          # search index, which can lag a just-created issue.
          issues=$(gh api "repos/$REPO/issues?labels=$label&state=open&per_page=100" \
            --jq '.[] | select(.pull_request | not) | select((.body // "") | contains($ENV.MARKER)) | .number')
          if [ "$JOB_STATUS" = cancelled ]; then
            outcome="Back-sync from production was cancelled or timed out"
          else
            outcome="Back-sync from production failed"
          fi
          if [ "$JOB_STATUS" = success ]; then
            for issue in $issues; do
              gh issue close "$issue" --repo "$REPO" --reason completed --comment "Back-sync from production passed: ${RUN_URL}"
            done
          elif [ -n "$issues" ]; then
            gh issue comment "$(printf '%s\n' "$issues" | head -n 1)" --repo "$REPO" --body "${outcome}: ${RUN_URL}"
          else
            gh label create "$label" --repo "$REPO" --force --color B60205 \
              --description "An SDK pipeline run failed; closed by the next successful run"
            gh issue create --repo "$REPO" --title "SDK pipeline is failing" --label "$label" --body "${outcome}: ${RUN_URL}

          Later failures of this workflow comment here; its next successful run closes this issue.

          ${MARKER}"
          fi
