name: Sync SDK repos

# Keeps the staging and production trunks in sync: fast-forwards production main
# back onto staging after a release (or any other production-side commit) so the
# trunks stay identical and the next stlc build is not held.
#
# This file lives in both the staging and production repo (stlc preserves
# .github/workflows/ across regeneration); the job self-routes so it only runs
# on staging. Adapted from the stlc sdk-repo example, with the PAT replaced by a
# short-lived gumnut-sdk-pipeline app token. The example's eager
# notify-back-sync and seal-dispatch jobs are deliberately omitted (no dispatch
# tokens in our setup — the twice-hourly poll is the sync; see the design doc).
#
# If the back-sync refuses with "staging main is not an ancestor": the trunks
# forked — something landed on staging main while production was ahead. Resolve
# by hand in a clone: merge production/main into staging main (plain merge, no
# force), push, then let the poll confirm. Never force-push either trunk.
on:
  schedule:
    # back-sync poll: a cheap pure-git check, twice hourly so an unsynced production
    # change can't hold codegen for long.
    - cron: '7,37 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  back-sync:
    # Fast-forward production main back onto staging so the trunks stay identical.
    runs-on: ubuntu-latest
    if: github.repository == 'gumnut-ai/photos-typescript-staging'
    concurrency:
      group: stlc-back-sync
      cancel-in-progress: true
    env:
      PRODUCTION_REPO: gumnut-ai/photos-sdk-typescript
    steps:
      - name: 'Mint sync token (Contents: write on staging + production; production is only read)'
        id: token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.GUMNUT_SDK_PIPELINE_APP_ID }}
          private-key: ${{ secrets.GUMNUT_SDK_PIPELINE_PRIVATE_KEY }}
          owner: gumnut-ai
          repositories: photos-typescript-staging,photos-sdk-typescript
          permission-contents: write

      - name: Check out staging
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch production main
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          git remote add production "https://x-access-token:${GH_TOKEN}@github.com/${PRODUCTION_REPO}.git"
          git fetch production main

      - name: Check whether production has content staging lacks
        id: diff
        run: |
          # Content compare: would merging production into staging change its tree?
          # If not, staging already has production's content (release-please commits).
          MERGED=$(git merge-tree --write-tree origin/main production/main) || MERGED=conflict
          STAGING_TREE=$(git rev-parse 'origin/main^{tree}')
          if [ "$MERGED" = "$STAGING_TREE" ]; then
            echo "Staging already has production's content. Nothing to pull back."
            echo "behind=false" >> "$GITHUB_OUTPUT"
          else
            echo "behind=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync production to staging (fast-forward)
        if: steps.diff.outputs.behind == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          # Refuse unless staging is an ancestor of production: otherwise the
          # trunks have forked and a fast-forward would be unsafe.
          if ! git merge-base --is-ancestor origin/main production/main; then
            echo "::error title=Back-sync blocked::staging main is not an ancestor of production/main. The trunks forked; merge production/main into staging main by hand (no force), then re-run."
            exit 1
          fi
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" production/main:refs/heads/main
          echo "Fast-forwarded staging/main to production/main."

      - name: Report failure
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          msg="stlc back-sync (sync from production) failed in ${REPO}. A stalled back-sync lets custom-code tracking drift, which later builds refuse on — investigate before the next build. Run: ${RUN_URL}"
          echo "::error title=stlc workflow failed::$msg"
          { echo "### ⚠️ stlc workflow failed"; echo ""; echo "$msg"; } >> "$GITHUB_STEP_SUMMARY"
